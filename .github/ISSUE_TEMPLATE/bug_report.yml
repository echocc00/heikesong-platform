name: 缺陷报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现路径，从命令开始写
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 附错误信息 / 栈
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Node 版本、操作系统、数据库迁移版本
    validations:
      required: true
