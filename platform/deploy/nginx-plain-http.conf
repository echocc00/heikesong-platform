# deploy/nginx-plain-http.conf — 让路形态：纯 HTTP + 自定义端口（**无 TLS**）
#
# ⚠️ 什么时候用这个模板（不要用默认的 deploy/nginx.conf）：
#    目标机是**复用既有业务的主机** —— 443 已被别的服务直接占用
#    （例：xray 的 VLESS+Reality 直接 bind 0.0.0.0:443，不经 nginx），
#    或 80 已被别的站点以 default_server 占用、不能抢。
#    此时本模板**只监听一个自定义 HTTP 端口**，不碰 443、不做 HTTP→HTTPS 跳转。
#
# ✅ 与默认模板的**上游口径完全一致**：127.0.0.1:8080
#    （与 systemd 单元的 Environment=PORT、环境文件的 PORT=8080 同一套），
#    ⇒ 换入口端口**不需要**动应用侧的端口口径。
#
# ⚠️ 端口口径：
#    __HTTP_PORT__  对外 HTTP 端口（install.sh 用 NGINX_HTTP_PORT 替换；默认 8081）
#    __SERVER_NAME__ server_name（域名；有域名填域名，没有填 IP 或 _）
#    __APP_DIR__    程序目录（如 /opt/heikesong/platform）
#
# ⛔ 本模板**没有 TLS** ⇒ 明文传输。正式对外必须确认这是可接受的形态，
#    或者在前面再加一层 TLS 终结（另一台机器的 nginx / 云负载均衡 / CDN）。
#    ⛔ 明文 HTTP 下浏览器会拒收带 Secure 标记的 Cookie ⇒ 登录失效。
#    ⇒ 那种形态必须让应用 COOKIE_SECURE=false（install.sh 的 COOKIE_SECURE 变量），
#    **不要**用 NODE_ENV=development 去绕（那会连带改掉其它生产行为）。

upstream heikesong_app {
    # ⛔ 只能起【一个】后端进程（单写者）。要加读能力就加 nginx 副本，不要加 Node 副本。
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __SERVER_NAME__;

    # 业务上传很小，8m 足够；防止超大 body 打满内存
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 静态资源直出（不进 Node 进程）────────────────────────
    # ✅ 这是「扩容只能加读」的落点：几百并发静态请求根本不进 Node。
    # ⚠️ web/assets/ 是【预留】的静态资源目录（带内容哈希、可长期缓存的版本位）：
    #    **本仓库当前没有任何构建步骤产出它**（演示版静态站的产物在
    #    platform/web/dist/，走**独立发布通道**，不经本 nginx）。
    #    目录不存在时本段对 /assets/ 请求返 404，不影响其它路径。
    # ⚠️ 别把它和「前端构建产物目录」混为一谈 —— 那个目录是 platform/web/dist/。
    location /assets/ {
        alias __APP_DIR__/web/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # index.html 不缓存（其余静态资源走上面的缓存策略）
    location = /index.html {
        proxy_pass http://heikesong_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    # ── 动态请求（含 SSE）──────────────────────────────────
    location / {
        proxy_pass http://heikesong_app;

        # ⚠️ SSE 必须 HTTP/1.1 + 空 Connection，否则事件被攒住，页面看起来"不实时"
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # ⚠️ 透传真实客户端 IP：审计日志要读它
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no;
    }
}
