# deploy/nginx-https-redirect.conf — 明文入口只做 301 跳转（业务全在 TLS 端口）
#
# ⚠️ 什么时候用这个模板：
#    平台已经上了 TLS（deploy/nginx-tls-port.conf），但**明文入口还在**（同一个
#    对外端口上的旧站点、或另一个 HTTP 端口）。此时有两个选择：
#      · 把明文入口**删掉**（rm 站点文件 + 软链）—— 最干净，但旧链接直接断。
#      · 把明文入口改成**本模板**（301 跳到 TLS 端口）—— 旧链接仍能落到正确的
#        地址，且**没有任何业务流量再走明文**。
#    本模板 = 后一种。
#
# ✅ 本模板**没有 upstream 块**：它不代理任何业务 ⇒
#    ① 不会与别的站点文件撞 upstream 名（nginx 的 upstream 名是全局的）；
#    ② 替换掉原来的明文站点文件后，原来那个 upstream 名也就随之消失，
#       不会出现「同名 upstream 重复定义」把整个 nginx 弄挂。
#
# ⚠️ 为什么是 **308** 而不是 301（这一条是踩过的坑，别改回去）：
#    浏览器对重定向状态码的处理分两类：
#      · 301 / 302 / 303 ⇒ **把 POST 降级成 GET，并丢掉请求体**；
#      · 307 / 308       ⇒ **保留方法与请求体**，原样重发。
#    我们的明文入口后面跟着**登录接口**（POST /api/auth/login）。
#    用 301 的话：POST → 301 → 浏览器改成 GET 且 body 为空 → 服务端收到空 body
#    ⇒ 判定为「手机号或密码不正确」⇒ **401 INVALID_CREDENTIALS**。
#    ⇒ 用户看到的是「口令错误」，真相却是**重定向把请求体吃掉了**（口令是对的）。
#    ⇒ 308 是 307 的永久版（永久迁移到 https 就该用永久码），
#      保留方法与请求体 ⇒ POST 原样送达 ⇒ 登录正常。
#    ⚠️ 若将来把明文入口改成 301，**必须同时**接受「POST 登录在旧地址上必然失败」
#      这个已知回归（或干脆把明文入口整个删掉）。
#
# ⚠️ 端口口径：
#    __HTTP_PORT__  明文入口端口（install.sh 用 NGINX_HTTP_PORT 替换；默认 8081）
#    __TLS_PORT__   TLS 端口（install.sh 用 NGINX_TLS_PORT 替换；默认 443）
#    __SERVER_NAME__ server_name
#
# ⚠️ 为什么跳转目标要**显式带上端口**：
#    $host 变量**不含端口**（客户端发 "8.133.200.235:8081" 时 $host = "8.133.200.235"）
#    ⇒ 不写端口就会跳到 443（默认 https 口），而我们的 TLS 往往在 8444 这类自定义口
#    ⇒ 跳转结果 443 打不开，等于「跳了个寂寞」。
#
# ⛔ 本模板**只做跳转**，不代理业务、不读 Cookie ⇒
#    「明文入口还开着」这件事本身不会泄露任何业务数据；泄露的是**跳转前那一跳的
#    URL 路径**（不含查询串里的敏感参数的前提是：业务不把敏感参数放 URL 上）。
#    ⇒ 若业务有敏感查询参数，仍应把明文入口整个删掉，而不是靠跳转。

server {
    listen __HTTP_PORT__;
    listen [::]:__HTTP_PORT__;
    server_name __SERVER_NAME__;

    location / {
        return 308 https://$host:__TLS_PORT__$request_uri;
    }
}
