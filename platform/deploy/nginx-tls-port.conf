# deploy/nginx-tls-port.conf — 让路形态的加密版：TLS + 自定义端口（**不碰 80、不碰 443**）
#
# ⚠️ 什么时候用这个模板（不要用默认的 deploy/nginx.conf）：
#    目标机是**复用既有业务的主机** —— 443 已被别的服务直接占用
#    （例：xray 的 VLESS+Reality 直接 bind 0.0.0.0:443，不经 nginx），
#    或 80 已被别的站点以 default_server 占用、不能抢。
#    与 deploy/nginx-plain-http.conf 的区别只有一个：**带 TLS**。
#    ⇒ 选哪个：
#        · 手上**没有**证书 / 不需要加密 → deploy/nginx-plain-http.conf
#        · 手上**有**证书（域名证书，或 Let's Encrypt 的 **IP 短周期证书**）
#          → 本模板（对外 https://<host>:<端口>/）
#
# ✅ 与其它模板的**上游口径完全一致**：127.0.0.1:8080
#    （与 systemd 单元的 Environment=PORT、环境文件的 PORT=8080 同一套），
#    ⇒ 换入口端口**不需要**动应用侧的端口口径。
#
# ⚠️ 端口口径：
#    __TLS_PORT__   对外 HTTPS 端口（install.sh 用 NGINX_TLS_PORT 替换；默认 443）
#    __SERVER_NAME__ server_name（域名；没有域名就填 IP）
#    __CERT_PATH__  证书路径（如 /etc/letsencrypt/live/<域名>/fullchain.pem）
#    __KEY_PATH__   私钥路径（如 /etc/letsencrypt/live/<域名>/privkey.pem）
#    __APP_DIR__    程序目录（如 /opt/heikesong/platform）
#
# ⛔ 本模板**没有 80 端口的 server 块** —— 两个原因，缺一不可：
#    ① 80 往往被既有业务以 default_server 占用。再加一个 server_name 更精确的块，
#       **IP 直访时命中的是精确 server_name**（nginx 的匹配规则：先精确后通配），
#       等于我们上线、别人的控制台被我们抢走入口。
#    ② 证书续期靠 ACME HTTP-01 校验，而校验目录（certbot webroot）**恰好**
#       挂在 80 的 default_server 上 —— 我们抢走 80 就等于**掐断自己的续期链路**
#       （短周期证书一旦续不上，过期当天服务直接不可用）。
#    ⇒ 明文入口（如果有）怎么办：让它继续代理，但应用侧 COOKIE_SECURE=false；
#      或把明文入口改成 301 跳转到本端口。两种都见 docs/deployment.md。
#
# ⛔ upstream 名字**故意**与 deploy/nginx.conf / nginx-plain-http.conf 不同
#    （heikesong_app_tls vs heikesong_app）：
#    nginx 的 upstream 名字是**全局**的 —— 同名会让 nginx -t 直接报
#    "duplicate upstream" 且**整个 nginx 起不来**（连带把别人的业务也带崩）。
#    本模板要能与让路模板**并存**（先加 TLS、验证通过再切 Cookie），
#    所以必须用不同的名字。
#
# ⚠️ nginx 需要 ≥ 1.25.1（用 `http2 on;` 语法）。更低版本请把
#    `http2 on;` 换成 `listen <端口> ssl http2;`。
#    ✅ 不用手工改：deploy/install.sh 会先跑 deploy/nginx-http2-compat.sh，
#    它按**目标机**的 nginx 版本自动决定：≥ 1.25.1 保留本写法，
#    < 1.25.1（Ubuntu 22.04=1.18 / 24.04=1.24 都是）自动降级成
#    `listen <端口> ssl http2;`（这个写法在**所有** nginx 版本上都合法）。

upstream heikesong_app_tls {
    # ⛔ 只能起【一个】后端进程（单写者）。要加读能力就加 nginx 副本，不要加 Node 副本。
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── HTTPS 主站（自定义端口）────────────────────────────────────────
server {
    listen __TLS_PORT__ ssl;
    listen [::]:__TLS_PORT__ ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 业务上传很小，8m 足够；防止超大 body 打满内存
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 静态资源直出（不进 Node 进程）────────────────────────
    # ✅ 这是「扩容只能加读」的落点：几百并发静态请求根本不进 Node。
    # ⚠️ web/assets/ 是【预留】的静态资源目录（带内容哈希、可长期缓存的版本位）：
    #    **本仓库当前没有任何构建步骤产出它**（演示版静态站的产物在
    #    platform/web/dist/，走**独立发布通道**，不经本 nginx）。
    #    目录不存在时本段对 /assets/ 请求返 404，不影响其它路径。
    # ⚠️ 别把它和「前端构建产物目录」混为一谈 —— 那个目录是 platform/web/dist/。
    location /assets/ {
        alias __APP_DIR__/web/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # index.html 不缓存（其余静态资源走上面的缓存策略）
    location = /index.html {
        proxy_pass http://heikesong_app_tls;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    # ── 动态请求（含 SSE）──────────────────────────────────
    location / {
        proxy_pass http://heikesong_app_tls;

        # ⚠️ SSE 必须 HTTP/1.1 + 空 Connection，否则事件被攒住，页面看起来"不实时"
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # ⚠️ 透传真实客户端 IP：审计日志要读它
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no;
    }
}
