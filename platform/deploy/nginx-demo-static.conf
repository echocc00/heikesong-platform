# deploy/nginx-demo-static.conf — 公网演示站（静态包）专用站点：只发静态文件，**不代理任何后端**
#
# ⚠️ 这个站点服务的是什么：
#    `node scripts/build-demo.js` 产出的**静态包**（默认 platform/web/dist/）——
#    规则引擎在**浏览器里**真实运行，不启后端、不建库、不连数据库。
#    ⇒ 与平台本体（deploy/nginx-tls-port.conf 那个反代）**完全独立**：
#       独立端口、独立 origin（cookie / localStorage 互不串）、独立发布节奏。
#
# ✅ 为什么用相对路径就够：演示站的 index.html 里引的是 `./web/styles.css`、
#    `./web/app.js`（相对路径）⇒ 挂到任意 base path 下都能正常加载
#    （这正是 build-demo.js 刻意用相对路径的原因）。
#
# ⚠️ 端口口径：
#    __TLS_PORT__   对外 HTTPS 端口（install.sh 用 NGINX_TLS_PORT 替换；默认 443）
#    __SERVER_NAME__ server_name（域名；没有域名就填 IP）
#    __CERT_PATH__  证书路径
#    __KEY_PATH__   私钥路径
#    __DEMO_DIR__   静态包所在目录（绝对路径；deploy-demo-site.sh 用 DEMO_DIR 替换）
#
# ⚛️ **本模板没有 upstream、也没有 proxy_pass** —— 它只发静态文件。
#    演示站与平台本体是两个 origin：**演示站不该能碰到平台的任何 API**。
#    一旦这里出现 proxy_pass（哪怕指回 127.0.0.1:8080），演示站就退化成了
#    平台的第二个入口，origin 隔离也没了 ⇒ 判别性用例会直接判红。

server {
    listen __TLS_PORT__ ssl;
    listen [::]:__TLS_PORT__ ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 静态包根目录（由 deploy-demo-site.sh 渲染成真实路径）
    root __DEMO_DIR__;
    index index.html;

    # 业务上传很小，8m 足够；防止超大 body 打满内存
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 入口页不缓存 ───────────────────────────────────────
    #    每次访问都要拿到最新的构建（演示站会随代码迭代重发）
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 构建清单也不缓存（它记录了产物时间与规则文件清单）
    location = /build-manifest.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # ── 其余静态资源 ───────────────────────────────────────
    #    ⚠️ 演示站的资源文件名**没有内容哈希**（不是生产构建）⇒
    #    不能给长缓存，否则发新版后浏览器还用旧文件 ⇒ 只给短缓存。
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
    }
}
